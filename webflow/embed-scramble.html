<script>
/* ============================================================
   scramble.js — v2.5.1
   Text scramble / cycle-in, triggered on scroll-into-view (or on
   a DOM event). No dependencies. No Webflow Interactions.

   v2.5.1: a frame writes only the cells whose glyph changed (settled
   cells are left alone), so a long run touches far less of the DOM.

   v2.5.0: runs wait for the page's preloader (window.hwPreloader.done,
   from the head code) before they start, so nothing plays under the
   overlay; the elements are still claimed at once, and the cipher
   pre-state is still drawn underneath.

   v2.4.0: a run is timed by the clock, not counted in frames, so it
   always takes its duration however busy the page is (a dropped frame
   used to stretch it, and on a slow frame rate it looked stuck); and a
   run started by the scroll is marked started, so the cipher that waits
   for the fonts can no longer cancel it and leave the glyphs behind.

   MARKUP CONTRACT (attributes only — classes stay for styling)

     data-scramble="duration, sweep, churn"
         duration  ms       default 900   how long the whole run takes
         sweep     0–1      default 0.65  L→R reveal vs all-at-once
         churn     0–1      default 0.28  how often a glyph re-rolls
       All three are optional and positional. Any of these work:
         data-scramble                  → 900, 0.65, 0.28
         data-scramble="1400"           → 1400, 0.65, 0.28
         data-scramble="750, 0.85"      → 750, 0.85, 0.28
         data-scramble="750, 0.85, 0.12"
         data-scramble="750,,0.12"      → skip a slot, keep its default

     data-scramble-chars="AB01#"   charset, default below
     data-scramble-delay="200"     ms before it starts
     data-scramble-lock            pin glyph widths (no wobble in
                                   proportional fonts)
     data-scramble-reveal          hold each char blank before it
                                   starts scrambling
     data-scramble-repeat          re-run every time it re-enters view
                                   (or every time the -on event fires)
     data-scramble-on-load         start on load instead of on scroll
     data-scramble-cipher          start as cipher glyphs (width-locked,
                                   so nothing shifts) and carry the class
                                   `is-scrambled` until the run starts —
                                   style the dim on that class. The real
                                   copy stays in the Designer and the DOM
                                   until the page has loaded its fonts
     data-scramble-on="name"       start when this DOM event reaches the
                                   element or an ancestor (e.g. the drone
                                   hero's drone:arrive), not on scroll
     data-scramble-off="name"      with -repeat and -cipher: back to
                                   cipher glyphs when this event reaches
                                   the element (e.g. drone:leave) — the
                                   run in reverse, the real text churning
                                   back into glyphs left to right

   The element's authored text IS the target, so the Designer canvas,
   SEO, and screen readers all see the real copy. It always lands back
   on clean text. Put the attributes on a plain-text element, or on a
   wrapper: then every text-bearing leaf inside it runs together and the
   wrapper carries the `is-scrambled` class.
   ============================================================ */
(function () {
  'use strict';

  var CHARS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!<>-_\\/[]{}=+*^?#';
  var DEFAULTS = { duration: 900, sweep: 0.65, churn: 0.28 };
  var STATE = 'is-scrambled';
  var REDUCED = window.matchMedia &&
                window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function clamp01(n) { return n < 0 ? 0 : n > 1 ? 1 : n; }

  /* "750, 0.85, 0.12" -> {duration:750, sweep:0.85, churn:0.12}
     Commas and/or spaces both work. Empty slots keep their default. */
  function parseOpts(raw) {
    var o = { duration: DEFAULTS.duration, sweep: DEFAULTS.sweep, churn: DEFAULTS.churn };
    raw = (raw || '').trim();
    if (!raw) return o;

    /* Split on commas when they're present so an empty slot survives
       ("750,,0.12" keeps the default sweep); otherwise split on spaces. */
    var parts = raw.indexOf(',') > -1 ? raw.split(',') : raw.split(/\s+/);
    var keys = ['duration', 'sweep', 'churn'];

    for (var i = 0; i < keys.length && i < parts.length; i++) {
      var token = parts[i].trim();
      if (token === '') continue;
      var v = parseFloat(token);
      if (!isNaN(v)) o[keys[i]] = v;
    }

    o.duration = Math.max(0, o.duration);
    o.sweep    = clamp01(o.sweep);
    o.churn    = clamp01(o.churn);
    return o;
  }

  /* el: the text element that runs; src: the element the attributes are read
     from (the same element, or the wrapper it sits in). */
  function Scramble(el, src) {
    src = src || el;
    this.el     = el;
    this.src    = src;
    this.target = el.textContent;
    this.opts   = parseOpts(src.getAttribute('data-scramble'));
    this.chars  = src.getAttribute('data-scramble-chars') || CHARS;
    this.delay  = parseFloat(src.getAttribute('data-scramble-delay')) || 0;
    this.cipher = src.hasAttribute('data-scramble-cipher');
    this.lock   = this.cipher || src.hasAttribute('data-scramble-lock');
    this.reveal = src.hasAttribute('data-scramble-reveal');
    this.raf    = null;
    this.cells  = null;
    this._tick  = this.tick.bind(this);
  }

  /* In a proportional font every swapped glyph is a different width, so
     the line wobbles even though the character COUNT is fixed. This wraps
     each character in an inline-block sized to its advance in the real,
     shaped run (measured with a Range before the text is touched, so
     kerning pairs and letter-spacing are kept) — the cells tile exactly
     where the letters land, and nothing shifts when the plain text comes
     back. Words stay intact so line breaking still behaves. */
  Scramble.prototype.buildCells = function () {
    var el = this.el, text = this.target;

    var adv = [], node = el.firstChild;
    if (node && node.nodeType === 3 && node.nodeValue === text && document.createRange) {
      var range = document.createRange(), boxes = [];
      for (var i = 0; i < text.length; i++) {
        range.setStart(node, i); range.setEnd(node, i + 1);
        var r = range.getBoundingClientRect();
        boxes.push({ l: r.left, r: r.right, t: r.top });
      }
      for (var j = 0; j < text.length; j++) {
        var b = boxes[j], n = boxes[j + 1];
        /* to the next character's start on the same line: the advance, kerning included; else its own box */
        adv.push(n && Math.abs(n.t - b.t) < 1 && n.l >= b.l ? n.l - b.l : b.r - b.l);
      }
    }

    el.textContent = '';
    var frag = document.createDocumentFragment(), cells = [], gaps = [], word = null;
    for (var k = 0; k < text.length; k++) {
      var ch = text[k];
      if (/\s/.test(ch)) {   /* a space stays a real space (a line can still break there), in a plain span so its advance can be matched */
        word = null;
        var g = document.createElement('span'); g.textContent = ch; g.__adv = adv[k];
        frag.appendChild(g); gaps.push(g);
        continue;
      }
      if (!word) {
        word = document.createElement('span');
        word.style.display = 'inline-block';
        word.style.whiteSpace = 'nowrap';
        frag.appendChild(word);
      }
      var c = document.createElement('span');
      c.style.display = 'inline-block';
      c.style.textAlign = 'left';
      c.style.letterSpacing = '0';
      c.textContent = ch;
      c.__adv = adv[k];
      word.appendChild(c);
      cells.push(c);
    }
    el.appendChild(frag);

    /* Without a measured run (no single text node) fall back to each cell's own width. */
    var widths = cells.map(function (c) { return c.__adv > 0 ? c.__adv : c.getBoundingClientRect().width; });
    cells.forEach(function (c, i) { c.style.width = widths[i] + 'px'; });
    /* A space between two boxes has lost its kerning with its neighbours: pad it out to its advance in the run. */
    gaps.forEach(function (g) {
      if (!(g.__adv > 0) || !g.firstChild) return;
      var rg = document.createRange(); rg.selectNodeContents(g);
      var d = g.__adv - rg.getBoundingClientRect().width;
      if (Math.abs(d) > 0.01) g.style.letterSpacing = (d + (parseFloat(getComputedStyle(g).letterSpacing) || 0)) + 'px';   // on top of the inherited spacing
    });
    return cells;
  };

  Scramble.prototype.glyph = function () {
    return this.chars.charAt(Math.floor(Math.random() * this.chars.length));
  };

  /* The cipher pre-state: every character a random glyph in its own cell. */
  Scramble.prototype.showCipher = function () {
    if (REDUCED || !this.target) return;
    if (this.raf) { cancelAnimationFrame(this.raf); this.raf = null; }
    if (!this.cells) this.cells = this.buildCells();
    for (var i = 0; i < this.cells.length; i++) this.cells[i].textContent = this.glyph();
  };

  /* Each character's frame: sweep is measured over non-space characters, so
     a long word doesn't get a faster reveal than a short one. */
  Scramble.prototype.plan = function () {
    var text  = this.target;
    var o     = this.opts;
    var total = Math.max(1, o.duration / 16.7);          // frames
    var count = text.replace(/\s/g, '').length || 1;     // non-space chars
    this.queue = [];
    this.cellIndex = [];
    var seen = 0;
    for (var i = 0; i < text.length; i++) {
      var ch = text[i];
      if (/\s/.test(ch)) {
        this.queue.push({ ch: ch, space: true });
        this.cellIndex.push(-1);
        continue;
      }
      var pos = seen / Math.max(1, count - 1);
      this.queue.push({
        ch: ch, space: false, sub: null,
        end: Math.floor(pos * total * o.sweep + Math.random() * total * (1 - o.sweep)) + 1
      });
      this.cellIndex.push(seen);
      seen++;
    }
    this.frame = 0;
    this.t0 = null;   // the run's clock starts at its first frame
  };

  Scramble.prototype.start = function () {
    if (this.raf && !this.out) return;
    if (this.raf) { cancelAnimationFrame(this.raf); this.raf = null; }
    if (REDUCED || !this.target) { this.el.textContent = this.target; return; }

    if (this.lock) { if (!this.cells) this.cells = this.buildCells(); }
    else { this.cells = null; this.el.textContent = this.target; }

    this.plan();
    this.out = false;
    var self = this;
    if (this.delay) {
      setTimeout(function () { self.raf = requestAnimationFrame(self._tick); }, this.delay);
    } else {
      this.raf = requestAnimationFrame(this._tick);
    }
  };

  /* The run in reverse: the real text churns back into cipher glyphs, left to
     right, and stays there (the cells are kept for the next run). */
  Scramble.prototype.hide = function () {
    if (REDUCED || !this.target) return;
    if (this.raf) { cancelAnimationFrame(this.raf); this.raf = null; }
    if (!this.cells) this.cells = this.buildCells();
    this.plan();
    this.out = true;
    this.raf = requestAnimationFrame(this._tick);
  };

  Scramble.prototype.paint = function (out) {
    if (!this.cells) { this.el.textContent = out.join(''); return; }
    for (var i = 0; i < out.length; i++) {
      var ci = this.cellIndex[i];
      if (ci >= 0 && this.cells[ci] && this.cells[ci].textContent !== out[i]) this.cells[ci].textContent = out[i];   // only the cells whose glyph changed
    }
  };

  Scramble.prototype.tick = function (now) {
    var out = [], settled = 0, q;
    /* the frame by the clock (a frame is 16.7ms), so a slow or busy page skips ahead rather than dragging the run out */
    if (this.t0 == null) this.t0 = now;
    this.frame = Math.floor((now - this.t0) / 16.7);

    for (var i = 0; i < this.queue.length; i++) {
      q = this.queue[i];

      if (q.space) { out.push(q.ch); settled++; continue; }

      if (this.out) {   /* the reverse: real until its frame, then a glyph */
        if (this.frame < q.end) out.push(q.ch);
        else { if (q.sub === null) q.sub = this.glyph(); out.push(q.sub); settled++; }
        continue;
      }

      if (this.frame >= q.end) {
        out.push(q.ch);
        settled++;
      } else if (this.reveal && this.frame < q.end * 0.25) {
        out.push(this.lock ? '' : ' ');
      } else {
        if (q.sub === null || Math.random() < this.opts.churn) q.sub = this.glyph();
        out.push(q.sub);
      }
    }

    this.paint(out);

    if (settled === this.queue.length) { if (this.out) { this.raf = null; return; } return this.finish(); }
    this.raf = requestAnimationFrame(this._tick);
  };

  Scramble.prototype.finish = function () {
    if (this.raf) cancelAnimationFrame(this.raf);
    this.raf = null;
    this.cells = null;
    this.el.textContent = this.target;   // always land on clean, real text
  };

  /* One attributed element = one group: the element itself when it holds
     plain text, or every text-bearing leaf inside it when it is a wrapper.
     The group starts, re-ciphers and carries the state class as one. */
  function Group(src) {
    this.src = src;
    var leaves = [];
    if (src.children.length) {
      [].forEach.call(src.querySelectorAll('*'), function (n) {
        if (!n.children.length && n.textContent.trim()) leaves.push(n);
      });
    } else {
      leaves.push(src);
    }
    this.items = leaves.map(function (n) { return new Scramble(n, src); });
    this.cipher = src.hasAttribute('data-scramble-cipher');
    this.repeat = src.hasAttribute('data-scramble-repeat');
  }

  Group.prototype.start = function () {
    this.src.classList.remove(STATE);
    this.items.forEach(function (s) { s.start(); });
  };

  Group.prototype.showCipher = function () {
    if (REDUCED) return;
    this.src.classList.add(STATE);
    this.items.forEach(function (s) { s.showCipher(); });
  };

  Group.prototype.hide = function () {
    if (REDUCED) return;
    this.src.classList.add(STATE);
    this.items.forEach(function (s) { s.hide(); });
  };

  function init() {
    var nodes = document.querySelectorAll('[data-scramble]');
    if (!nodes.length) return;

    /* Nothing runs until the preloader has lifted (it resolves at once when there is none). */
    var gate = (window.hwPreloader && window.hwPreloader.done) || Promise.resolve();

    var observer = 'IntersectionObserver' in window
      ? new IntersectionObserver(function (entries) {
          entries.forEach(function (entry) {
            if (!entry.isIntersecting) return;
            var inst = entry.target.__scramble;
            if (!inst) return;
            inst.started = true;   // so the cipher waiting on the fonts cannot cancel this run
            inst.start();
            if (!inst.repeat) observer.unobserve(entry.target);
          });
        }, { threshold: 0.35, rootMargin: '0px 0px -10% 0px' })
      : null;

    [].forEach.call(nodes, function (el) {
      if (el.__scramble) return;                 // already wired
      var inst = new Group(el);
      el.__scramble = inst;

      var on = el.getAttribute('data-scramble-on'), off = el.getAttribute('data-scramble-off');
      var reaches = function (e) { return e.target && e.target.nodeType === 1 && e.target.contains(el); };

      if (inst.cipher) {
        /* Widths are measured, so the cipher waits for the page's fonts. */
        var ready = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
        ready.then(function () { if (!inst.started) inst.showCipher(); });
      }

      if (on) {
        document.addEventListener(on, function (e) { if (reaches(e)) gate.then(function () { inst.started = true; inst.start(); }); });
        if (off && inst.repeat && inst.cipher) {
          document.addEventListener(off, function (e) { if (reaches(e)) { inst.started = false; inst.hide(); } });
        }
      } else if (el.hasAttribute('data-scramble-on-load') || !observer) {
        gate.then(function () { inst.started = true; inst.start(); });
      } else {
        gate.then(function () { observer.observe(el); });
      }
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

  /* Re-scan after CMS swaps or nodes you add yourself. */
  window.hwScrambleRefresh = init;
})();
  </script>
