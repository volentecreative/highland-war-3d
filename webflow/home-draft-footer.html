<!-- Ethos cards: the corner dots follow the card's border to border-02, on hover and while the card is active
     (below). Custom code because the Designer cannot style a child from its parent's hover or state class; the dots'
     own transition is on their classes (corner-dot-tl / -tr / -bl / -br). -->
<style>
  .ethos-card:hover > [class*="corner-dot-"],
  .ethos-card.is-active > [class*="corner-dot-"] { background-color: var(--_theme---border-02); }
</style>
<script>
/* Ethos cards, up to 991px: the card crossing the middle of the screen gets is-active (its border and corner dots go to
   border-02, styled as .ethos-card.is-active in the Designer at the tablet breakpoint and down) and its 3D mark plays
   its hover animation (iso-marks.js listens for focusin / focusout on the card, so those are sent); as the card moves on,
   either way, the class comes off and the mark plays back. A touch on a card no longer toggles the mark there, so a
   scroll that starts on a card cannot set it off. Above 991px the class is never set and the marks follow the hover. */
(function () {
  if (!('IntersectionObserver' in window)) return;
  var cards = document.querySelectorAll('.ethos-card');
  if (!cards.length) return;
  var narrow = window.matchMedia('(max-width: 991px)');
  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      var on = narrow.matches && e.isIntersecting, card = e.target;
      if (card.classList.contains('is-active') === on) return;
      card.classList.toggle('is-active', on);
      card.dispatchEvent(new FocusEvent(on ? 'focusin' : 'focusout', { bubbles: true }));
    });
  }, { rootMargin: '-42% 0px -42% 0px' });   // the middle 16% of the viewport
  [].forEach.call(cards, function (c) { io.observe(c); });
  document.addEventListener('pointerdown', function (e) {
    if (narrow.matches && e.pointerType === 'touch' && e.target.closest && e.target.closest('.ethos-card')) e.stopPropagation();
  }, true);
})();

/* The docked band's product name (.hero-drone_name, up to 991px): hidden while the product title (.product_title) can
   still be seen, and faded in (is-shown, a combo class: opacity and its transition are in the Designer) once the
   title has scrolled up under the band; out again when it comes back down. The band's bottom is the sticky holder's
   (the navbar's height plus 42% of the rest of the screen), so the observer's top edge is set to it, and reset on a
   resize. */
(function () {
  var name = document.querySelector('.hero-drone_name'), title = document.querySelector('.product_title'), band = document.querySelector('.hero-drone_sticky');
  if (!name || !title || !band || !('IntersectionObserver' in window)) return;
  var io = null;
  function watch() {
    if (io) io.disconnect();
    var nav = document.querySelector('.navbar_component'), edge = Math.round((nav ? nav.offsetHeight : 0) + band.offsetHeight);
    io = new IntersectionObserver(function (entries) {
      var e = entries[entries.length - 1];
      name.classList.toggle('is-shown', !e.isIntersecting && e.boundingClientRect.top < edge);
    }, { rootMargin: '-' + edge + 'px 0px 0px 0px' });
    io.observe(title);
  }
  watch();
  var t = 0; window.addEventListener('resize', function () { clearTimeout(t); t = setTimeout(watch, 200); });
})();

/* Background videos (the purpose section's archive footage): play whenever they are near the screen and pause
   when they are not. Webflow's autoplay alone can be refused on phones (iOS Low Power Mode, data saver, or a play
   attempted before the video was ready), which leaves the first frame frozen: this re-asserts muted + playsinline,
   retries on the way into view, and once more on the visitor's first touch, which every browser accepts. */
(function () {
  var vids = [].slice.call(document.querySelectorAll('.w-background-video video'));
  if (!vids.length) return;
  var near = [];
  function play(v) {
    v.muted = true; v.setAttribute('muted', ''); v.playsInline = true; v.setAttribute('playsinline', '');
    var p = v.play(); if (p && p.catch) p.catch(function () {});
  }
  var io = 'IntersectionObserver' in window ? new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      var v = e.target, i = near.indexOf(v);
      if (e.isIntersecting) { if (i < 0) near.push(v); play(v); }
      else { if (i > -1) near.splice(i, 1); if (!v.paused) v.pause(); }
    });
  }, { rootMargin: '200px 0px' }) : null;
  vids.forEach(function (v) { if (io) io.observe(v); else play(v); });
  function kick() { near.forEach(function (v) { if (v.paused) play(v); }); }
  document.addEventListener('touchstart', kick, { passive: true });
  document.addEventListener('click', kick);
})();

/* The scroll prompt (.hero_scroll, under the hero copy's Contact button, styled in the Designer: hidden by default, is-shown fades
   and lifts it in): it appears whenever the page has been still for 3.5s while the prompt is on screen - first 3.5s
   after the page is ready (after the load gate lifts), then again each time the visitor stops scrolling - and any
   scroll fades it away until the next pause. Its chevron bobs gently while it shows (a Web Animations loop, transform
   only); with reduced motion it appears without the bob. */
(function () {
  var el = document.querySelector('[data-hero-scroll]');
  if (!el) return;
  var icon = el.querySelector('.hero_scroll-icon'), anim = null, shown = false, ready = false, idleT = 0, stopT = 0, AT = 3500;
  var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function onScreen() { var r = el.getBoundingClientRect(); return r.bottom > 0 && r.top < window.innerHeight; }
  function show() {
    if (shown || !onScreen()) return; shown = true; clearTimeout(stopT);
    el.classList.add('is-shown');
    if (!anim && !reduced && icon && icon.animate)
      anim = icon.animate([{ transform: 'translateY(0)' }, { transform: 'translateY(0.3rem)' }], { duration: 900, iterations: Infinity, direction: 'alternate', easing: 'ease-in-out' });
  }
  function hide() {
    if (!shown) return; shown = false;
    el.classList.remove('is-shown');
    stopT = setTimeout(function () { if (anim) { anim.cancel(); anim = null; } }, 700);   // the bob stops once it has faded
  }
  function wait() { clearTimeout(idleT); if (ready) idleT = setTimeout(show, AT); }
  window.addEventListener('scroll', function () { hide(); wait(); }, { passive: true });
  var gate = window.hwPreloader && window.hwPreloader.done ? window.hwPreloader.done : Promise.resolve();
  gate.then(function () { ready = true; wait(); });
})();

/* The page's own scrollbar (.scrollbar_component with its .scrollbar_thumb, at the end of the body, styled in the
   Designer: invisible by default, is-active shows it). On mouse and trackpad devices the browser's scrollbar is hidden
   (html.hw-scrollbar, head code), so nothing shifts when the scroll locks and unlocks; this one floats over the content
   and shows while the page scrolls or the pointer is near the right edge, fading out a second after. Its thumb follows
   the scroll (height and position written here, as a transform) and can be dragged. Phones and tablets keep their
   native overlay scrollbars: there, and if the element is missing, it is removed and the native one stays. */
(function () {
  var root = document.documentElement, sb = document.querySelector('[data-hw-scrollbar]'), th = sb && sb.querySelector('[data-hw-scrollbar-thumb]');
  if (!sb || !th || !root.classList.contains('hw-scrollbar')) { root.classList.remove('hw-scrollbar'); if (sb && sb.parentNode) sb.parentNode.removeChild(sb); return; }
  var EDGE = 24, HOLD = 1000, MINH = 32, hideT = 0, near = false, drag = null, raf = 0, m = null;
  function measure() {
    var vh = window.innerHeight, sh = Math.max(root.scrollHeight, document.body.scrollHeight), track = sb.clientHeight;
    m = { max: Math.max(0, sh - vh), track: track, h: Math.max(MINH, Math.round(track * vh / Math.max(1, sh))) };
    sb.style.display = m.max > 1 ? '' : 'none'; th.style.height = m.h + 'px';
  }
  function place() { raf = 0; if (!m) measure(); var y = m.max ? (window.scrollY / m.max) * (m.track - m.h) : 0; th.style.transform = 'translateY(' + Math.max(0, Math.min(m.track - m.h, y)).toFixed(1) + 'px)'; }
  function queue() { if (!raf) raf = requestAnimationFrame(place); }
  function show() { sb.classList.add('is-active'); clearTimeout(hideT); if (!drag && !near) hideT = setTimeout(function () { sb.classList.remove('is-active'); }, HOLD); }
  window.addEventListener('scroll', function () { queue(); show(); }, { passive: true });
  window.addEventListener('resize', function () { measure(); queue(); });
  if (window.ResizeObserver) new ResizeObserver(function () { measure(); queue(); }).observe(document.body);   // the page grows as embeds load
  document.addEventListener('mousemove', function (e) { var n = e.clientX >= window.innerWidth - EDGE; if (n !== near) { near = n; show(); } }, { passive: true });
  document.addEventListener('mouseleave', function () { near = false; show(); });
  th.addEventListener('pointerdown', function (e) {
    if (e.button !== 0) return; e.preventDefault(); measure();
    drag = { y: e.clientY, s: window.scrollY, k: m.max / Math.max(1, m.track - m.h) }; th.setPointerCapture(e.pointerId); show();
  });
  th.addEventListener('pointermove', function (e) {
    if (!drag) return; var to = Math.max(0, Math.min(m.max, drag.s + (e.clientY - drag.y) * drag.k));
    try { if (typeof lenis !== 'undefined' && lenis.scrollTo) lenis.scrollTo(to, { immediate: true }); else window.scrollTo(0, to); } catch (err) { window.scrollTo(0, to); }
  });
  function end() { if (!drag) return; drag = null; show(); }
  th.addEventListener('pointerup', end); th.addEventListener('pointercancel', end);
  measure(); place();
})();
</script>
