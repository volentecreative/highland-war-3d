<!-- Ethos cards: the corner dots follow the card's border to border-02, on hover and while the card is active
     (below). Custom code because the Designer cannot style a child from its parent's hover or state class; the dots'
     own transition is on their classes (corner-dot-tl / -tr / -bl / -br). -->
<style>
  .ethos-card:hover > [class*="corner-dot-"],
  .ethos-card.is-active > [class*="corner-dot-"] { background-color: var(--_theme---border-02); }
</style>
<script>
/* Ethos cards, up to 991px: the card crossing the middle of the screen gets is-active (its border and corner dots go to
   border-02, styled as .ethos-card.is-active in the Designer at the tablet breakpoint and down) and its 3D mark plays
   its hover animation (iso-marks.js listens for focusin / focusout on the card, so those are sent); as the card moves on,
   either way, the class comes off and the mark plays back. A touch on a card no longer toggles the mark there, so a
   scroll that starts on a card cannot set it off. Above 991px the class is never set and the marks follow the hover. */
(function () {
  if (!('IntersectionObserver' in window)) return;
  var cards = document.querySelectorAll('.ethos-card');
  if (!cards.length) return;
  var narrow = window.matchMedia('(max-width: 991px)');
  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      var on = narrow.matches && e.isIntersecting, card = e.target;
      if (card.classList.contains('is-active') === on) return;
      card.classList.toggle('is-active', on);
      card.dispatchEvent(new FocusEvent(on ? 'focusin' : 'focusout', { bubbles: true }));
    });
  }, { rootMargin: '-42% 0px -42% 0px' });   // the middle 16% of the viewport
  [].forEach.call(cards, function (c) { io.observe(c); });
  document.addEventListener('pointerdown', function (e) {
    if (narrow.matches && e.pointerType === 'touch' && e.target.closest && e.target.closest('.ethos-card')) e.stopPropagation();
  }, true);
})();

/* The docked band's product name (.hero-drone_name, up to 991px): hidden while the product title (.product_title) can
   still be seen, and faded in (is-shown, a combo class: opacity and its transition are in the Designer) once the
   title has scrolled up under the band; out again when it comes back down. The band's bottom is the sticky holder's
   (the navbar's height plus 42% of the rest of the screen), so the observer's top edge is set to it, and reset on a
   resize. */
(function () {
  var name = document.querySelector('.hero-drone_name'), title = document.querySelector('.product_title'), band = document.querySelector('.hero-drone_sticky');
  if (!name || !title || !band || !('IntersectionObserver' in window)) return;
  var io = null;
  function watch() {
    if (io) io.disconnect();
    var nav = document.querySelector('.navbar_component'), edge = Math.round((nav ? nav.offsetHeight : 0) + band.offsetHeight);
    io = new IntersectionObserver(function (entries) {
      var e = entries[entries.length - 1];
      name.classList.toggle('is-shown', !e.isIntersecting && e.boundingClientRect.top < edge);
    }, { rootMargin: '-' + edge + 'px 0px 0px 0px' });
    io.observe(title);
  }
  watch();
  var t = 0; window.addEventListener('resize', function () { clearTimeout(t); t = setTimeout(watch, 200); });
})();

/* Background videos (the purpose section's archive footage): play whenever they are near the screen and pause
   when they are not. Webflow's autoplay alone can be refused on phones (iOS Low Power Mode, data saver, or a play
   attempted before the video was ready), which leaves the first frame frozen: this re-asserts muted + playsinline,
   retries on the way into view, and once more on the visitor's first touch, which every browser accepts. */
(function () {
  var vids = [].slice.call(document.querySelectorAll('.w-background-video video'));
  if (!vids.length) return;
  var near = [];
  function play(v) {
    v.muted = true; v.setAttribute('muted', ''); v.playsInline = true; v.setAttribute('playsinline', '');
    var p = v.play(); if (p && p.catch) p.catch(function () {});
  }
  var io = 'IntersectionObserver' in window ? new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      var v = e.target, i = near.indexOf(v);
      if (e.isIntersecting) { if (i < 0) near.push(v); play(v); }
      else { if (i > -1) near.splice(i, 1); if (!v.paused) v.pause(); }
    });
  }, { rootMargin: '200px 0px' }) : null;
  vids.forEach(function (v) { if (io) io.observe(v); else play(v); });
  function kick() { near.forEach(function (v) { if (v.paused) play(v); }); }
  document.addEventListener('touchstart', kick, { passive: true });
  document.addEventListener('click', kick);
})();

/* The scroll prompt (.hero_scroll, under the hero copy's Contact button, styled in the Designer: hidden by default, is-shown fades
   and lifts it in): for visitors who have not started scrolling, it appears 3.5s after the page is ready (after the
   load gate lifts) if the page is still at the top, and its chevron bobs gently (a Web Animations loop, transform
   only); the first scroll fades it away for good. With reduced motion it appears without the bob. */
(function () {
  var el = document.querySelector('[data-hero-scroll]');
  if (!el) return;
  var icon = el.querySelector('.hero_scroll-icon'), anim = null, gone = false, AT = 3500, TOP = 24;
  var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function hide() {
    if (gone || window.scrollY < TOP) return; gone = true;
    window.removeEventListener('scroll', hide);
    el.classList.remove('is-shown');
    if (anim) setTimeout(function () { anim.cancel(); }, 700);
  }
  function show() {
    if (gone || window.scrollY >= TOP) { gone = true; return; }
    el.classList.add('is-shown');
    if (!reduced && icon && icon.animate)
      anim = icon.animate([{ transform: 'translateY(0)' }, { transform: 'translateY(0.3rem)' }], { duration: 900, iterations: Infinity, direction: 'alternate', easing: 'ease-in-out' });
  }
  window.addEventListener('scroll', hide, { passive: true });
  var ready = window.hwPreloader && window.hwPreloader.done ? window.hwPreloader.done : Promise.resolve();
  ready.then(function () { setTimeout(show, AT); });
})();
</script>
