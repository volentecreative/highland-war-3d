<link rel="preconnect" href="https://cdnjs.cloudflare.com">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">
<link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
<!-- Up to 991px the product copy rides over the drone until the drone docks into the band at the top
     (drone-hero.js puts is-docked on .hero-drone_track and on #hero-drone), then slides under the band.
     The line under the band is the copy's own top edge (.product_seam, a 1px sticky div at the top of .product_panel,
     styled in the Designer): it scrolls up with the copy and sticks at the band's bottom, so there is only ever one line
     and the browser holds it there itself, with no script in the way on a fast scroll.
     While the mobile menu is open the band's labels (the eyebrow and the dim RIDGE) are hidden, so they never
     show through the menu's dim over the hero; custom code because the open state is on the navbar, not an
     ancestor of the labels (:has). -->
<style>
  @media (max-width: 991px) {
    .hero-drone_track.is-docked .section_product { z-index: -1; }
    html:has(.navbar_menu.is-open) .hero-drone_labels { visibility: hidden; }
  }
</style>
<!-- Load gate (every load) and preloader (first visit in a session). Custom code because it has to act before the
     page paints: it is built here in <head> and put straight on <html>, so the Designer never sees it.
     The drone is part of the scroll choreography, so the page is never scrollable before it is drawn: on every load
     (a reload too) the browser's scroll restoration is off and the page starts at the top, the scroll is locked, and
     the hero copy is held back (hw-gate), while the page is laid out underneath with the drone's poster frame (a
     still of its first frame without the flag, in the drone embed) in the canvas's place. Once the drone is drawn (and the fonts are
     in), the scroll unlocks, every scroll scene re-measures (a resize; Lenis too), and two frames later the poster
     fades into the live canvas and the hero copy fades in and deciphers (window.hwPreloader.done, which the scramble
     embed waits on); a link to an #anchor on this page is followed then.
     First visit in a session: the full preloader below (the Highland mark spinning, a real progress bar), shown for
     at least 2s so it reads as intended rather than as a flicker: the bar fills steadily over those 2s (or follows the
     real load, if that is slower), holds at 100% for a beat, then the overlay lifts. Every other load: nothing is shown at all unless the drone takes more than 300ms, and then only a
     small spinning mark and bar at the foot of the screen; from the cache the gate lifts before it can be noticed.
     Either way the gate gives up after 8s (the poster then stays as the drone's stand-in if it failed).
     Progress is real: the drone embed reports its model bytes, three.js, the loader and the build (drone-hero.js
     onProgress), and the fonts and the images in the first screen count too. -->
<style>
  #hw-preloader { position: fixed; inset: 0; z-index: 2147483000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2rem;
    background: var(--_theme---background-01, #222322); color: var(--_theme---text-01, #fcfcfc); touch-action: none;
    transition: opacity 500ms ease, transform 500ms ease; }
  #hw-preloader.is-done { opacity: 0; transform: translateY(-1.5rem); pointer-events: none; }
  .hw-preloader_stage { perspective: 40rem; }
  .hw-preloader_mark { display: block; width: 4.5rem; height: auto; overflow: visible; animation: hw-preloader-spin 4.8s linear infinite; }
  .hw-preloader_mark path { fill: none; stroke: currentColor; stroke-width: 1.25px; vector-effect: non-scaling-stroke; stroke-linejoin: miter; }
  @keyframes hw-preloader-spin { to { transform: rotateY(360deg); } }
  .hw-preloader_meta { display: flex; flex-direction: column; align-items: center; gap: 0.75rem;
    font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.75rem; font-weight: 500; line-height: 1; letter-spacing: 0.1em; text-transform: uppercase; }
  .hw-preloader_label { display: flex; justify-content: space-between; width: 9rem; }
  .hw-preloader_pct { color: var(--_theme---text-03, #a2a2a2); font-variant-numeric: tabular-nums; }
  .hw-preloader_bar { width: 9rem; height: 1px; overflow: hidden; background: var(--_theme---border-01, #313231); }
  .hw-preloader_fill { height: 100%; background: currentColor; transform: scaleX(0); transform-origin: 0 50%; }
  /* the quiet gate's indicator: a small mark and bar at the foot of the screen, faded in only after 300ms */
  #hw-gate { position: fixed; left: 50%; bottom: 2rem; z-index: 2147483000; display: flex; flex-direction: column; align-items: center; gap: 0.75rem;
    color: var(--_theme---text-01, #fcfcfc); transform: translateX(-50%); opacity: 0; pointer-events: none; transition: opacity 250ms ease; }
  #hw-gate.is-shown { opacity: 1; }
  #hw-gate .hw-preloader_mark { width: 1.75rem; }
  #hw-gate .hw-preloader_bar { width: 3rem; }
  html.hw-preloading, html.hw-preloading body { overflow: hidden; }
  /* while the gate is up the hero copy waits, so it arrives with the drone; the poster under it is in the drone embed */
  .hero_copy { transition: opacity 300ms ease; }
  html.hw-gate .hero_copy { opacity: 0; }
  .hw-drone-poster { position: absolute; inset: 0; overflow: hidden; pointer-events: none; transition: opacity 250ms ease; }
  .hw-drone-poster img { position: absolute; display: block; height: auto; max-width: none; top: 93%; left: 3.368%; width: 93.264%; margin-top: -8.724%; }
  .hw-drone-poster img.is-narrow { left: 0; width: 100%; margin-top: -14.934%; }
  html.hw-drone-live .hw-drone-poster { opacity: 0; }
  @media (prefers-reduced-motion: reduce) {
    .hw-preloader_mark { animation: none; }
    #hw-preloader { transition: opacity 300ms ease; }
    #hw-preloader.is-done { transform: none; }
  }
</style>
<script>
(function () {
  'use strict';
  var KEY = 'hw-preloader-seen', MIN = 2000, MAX = 8000, QUIET = 300;
  var root = document.documentElement, t0 = Date.now();
  var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var resolveDone, done = new Promise(function (r) { resolveDone = r; });

  /* every load starts at the top, whatever the browser remembers; a #anchor is followed once the gate lifts */
  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
  var hash = location.hash && location.hash.length > 1 ? location.hash : '';
  if (hash) { try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} }   // so the browser does not jump there now
  window.scrollTo(0, 0);

  var seen = false;
  try { seen = sessionStorage.getItem(KEY) === '1'; } catch (e) {}

  var api = window.hwPreloader = { done: done, report: function () {}, track: function (n, p) { return p; } };
  root.classList.add('hw-preloading', 'hw-gate');
  var block = function (e) { e.preventDefault(); };
  document.addEventListener('touchmove', block, { passive: false });   // iOS can still scroll an overflow:hidden page by touch
  document.addEventListener('wheel', block, { passive: false });

  /* ---- what shows: the full overlay on a first visit, a small indicator (after 300ms) otherwise ---- */
  var MARK = '<svg class="hw-preloader_mark" viewBox="-1 -1 83 84" aria-hidden="true"><path d="' +
    'M46.5 0H28.66V8.5H36.07V36.82H44.58V8.5H48L51.98 11.83V4.59L46.51 0H46.5Z' +
    'M76.37 2.34H71.7L51.96 18.87V64.21L60.46 71.32V22.82L67.86 16.64V64.9L76.36 57.75V9.19L80.61 5.9L76.36 2.34H76.37Z' +
    'M0 5.9L4.25 9.19V57.74L12.75 64.89V16.63L20.15 22.81V71.3L28.65 64.19V18.87L8.92 2.34H4.25L0 5.9Z' +
    'M44.57 44.23H36.06V67.65L26.04 76.04L31.97 80.97H48.65L54.58 76.04L44.56 67.67V44.24L44.57 44.23Z' +
    '"/></svg>';
  var el = document.createElement('div'), pct = null;
  el.setAttribute('role', 'progressbar'); el.setAttribute('aria-label', 'Loading'); el.setAttribute('aria-valuemin', '0'); el.setAttribute('aria-valuemax', '100');
  if (!seen) {
    el.id = 'hw-preloader';
    el.innerHTML = '<div class="hw-preloader_stage">' + MARK + '</div>' +
      '<div class="hw-preloader_meta"><div class="hw-preloader_label"><span>Loading</span><span class="hw-preloader_pct">0%</span></div>' +
      '<div class="hw-preloader_bar"><div class="hw-preloader_fill"></div></div></div>';
    pct = el.querySelector('.hw-preloader_pct');
  } else {
    el.id = 'hw-gate';
    el.innerHTML = '<div class="hw-preloader_stage">' + MARK + '</div><div class="hw-preloader_bar"><div class="hw-preloader_fill"></div></div>';
    setTimeout(function () { if (el && !finished) el.classList.add('is-shown'); }, QUIET);
  }
  root.appendChild(el);
  var fill = el.querySelector('.hw-preloader_fill');

  /* ---- progress: named sources, each 0..1, weighted ---- */
  var W = { fonts: 0.1, images: 0.15, drone: 0.75 }, parts = {}, pending = {}, closed = false, finished = false, droneOk = true;
  function set(name, f) { parts[name] = Math.max(parts[name] || 0, Math.min(1, f)); }
  function real() { var s = 0, w = 0; for (var k in pending) { w += W[k] || 0.1; s += (W[k] || 0.1) * (parts[k] || 0); } return w ? s / w : 0; }
  function settle(name) { set(name, 1); delete pending[name]; check(); }
  api.track = function (name, p) { pending[name] = true; parts[name] = parts[name] || 0;
    Promise.resolve(p).then(function () { settle(name); }, function () { if (name === 'drone') droneOk = false; settle(name); }); return p; };
  api.report = function (name, f) { if (pending[name]) set(name, f); };

  /* the drone: drone-hero.js's onProgress state -> 0..1 (scripts 15%, model bytes 75%, build 10%). Without a
     size from the server the bytes count against the model's known size (the meshopt file), never past 90% of their share. */
  api.drone = function (s) {
    var b = s.total ? s.loaded / s.total : Math.min(0.9, s.loaded / 341568);
    api.report('drone', (s.scripts / 2) * 0.15 + b * 0.75 + (s.built ? 0.1 : 0));
  };

  api.track('fonts', document.fonts && document.fonts.ready ? document.fonts.ready : null);

  /* the images in the first screen, once the DOM is in; the embeds have registered by then */
  function onDom() {
    if (!hash) window.scrollTo(0, 0);
    var imgs = [].filter.call(document.images, function (i) { var r = i.getBoundingClientRect(); return r.top < innerHeight && r.bottom > 0 && r.width > 0; });
    var left = imgs.filter(function (i) { return !i.complete; });
    var n = left.length;
    api.track('images', new Promise(function (res) {
      if (!n) return res();
      var got = 0;
      left.forEach(function (i) { var one = function () { got++; set('images', got / n); if (got >= n) res(); }; i.addEventListener('load', one, { once: true }); i.addEventListener('error', one, { once: true }); });
    }));
    try { if (typeof lenis !== 'undefined' && lenis.stop) lenis.stop(); } catch (e) {}
    closed = true; check();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', onDom); else onDom();

  /* ---- the bar, eased toward the real value ---- */
  var shown = 0;
  function paint() {
    if (!el) return;
    var target = finished ? 1 : Math.min(0.99, real(), seen ? 1 : (Date.now() - t0) / MIN);   // first visit: the bar is paced to fill over MIN, so it never races to 100% and waits
    shown += (target - shown) * (reduced ? 1 : 0.18);
    if (target - shown < 0.002) shown = target;
    fill.style.transform = 'scaleX(' + shown.toFixed(3) + ')';
    var p = Math.round(shown * 100);
    if (pct) pct.textContent = p + '%';
    el.setAttribute('aria-valuenow', String(p));
    requestAnimationFrame(paint);
  }
  requestAnimationFrame(paint);

  function check() { if (!finished && closed && !Object.keys(pending).length) finish(); }
  function finish() {
    if (finished) return; finished = true;
    var wait = seen ? 0 : Math.max(0, MIN - (Date.now() - t0)) + (reduced ? 0 : 250);   // first visit: at least 2s, then 250ms held at 100% before it lifts
    setTimeout(lift, wait);
  }
  var failsafe = setTimeout(function () { finished = true; lift(); }, MAX);

  var lifted = false;
  function lift() {
    if (lifted) return; lifted = true; clearTimeout(failsafe);
    try { sessionStorage.setItem(KEY, '1'); } catch (e) {}
    if (!hash) window.scrollTo(0, 0);
    /* unlock, then have every scroll scene re-measure with the scrollbar back (the drone, the topo map, the sticky tracks, Lenis) */
    root.classList.remove('hw-preloading');
    document.removeEventListener('touchmove', block); document.removeEventListener('wheel', block);
    try { if (typeof lenis !== 'undefined') { if (lenis.resize) lenis.resize(); if (lenis.start) lenis.start(); } } catch (e) {}
    window.dispatchEvent(new Event('resize'));
    requestAnimationFrame(function () { requestAnimationFrame(function () {
      if (droneOk) root.classList.add('hw-drone-live');   // the poster fades into the live canvas (a failed drone keeps its poster)
      root.classList.remove('hw-gate');                    // the hero copy fades in…
      resolveDone();                                       // … and deciphers
      if (el) { el.classList.add('is-done'); el.classList.remove('is-shown'); }
      setTimeout(function () {
        if (el && el.parentNode) el.parentNode.removeChild(el); el = null;
        if (droneOk) { var p = document.querySelector('.hw-drone-poster'); if (p && p.parentNode) p.parentNode.removeChild(p); }
      }, 500);
      if (hash) {
        try { history.replaceState(null, '', location.pathname + location.search + hash); } catch (e) {}
        var t = null; try { t = document.querySelector(hash); } catch (e) {}
        if (t) { try { if (typeof lenis !== 'undefined' && lenis.scrollTo) lenis.scrollTo(t, { immediate: true }); else t.scrollIntoView(); } catch (e) { t.scrollIntoView(); } }
      }
    }); });
  }
})();
</script>
