<!-- The contact form lives in the site-wide contact-modal component (narthex modal key "contact"). Arriving on /contact
     opens it straight away: this puts ?modal=contact in the address before narthex starts, so narthex opens it
     itself, once (opening it from here as well announced it twice, and the Lenis pause then never let go).
     Closing it leaves this page's heading and a button to open it again. -->
<script>
  (function () {
    try {
      var u = new URL(location.href);
      if (!u.searchParams.has('modal')) { u.searchParams.set('modal', 'contact'); history.replaceState(history.state, '', u); }
    } catch (e) {}
  })();
</script>
