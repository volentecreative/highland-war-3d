<!-- The contact form lives in the site-wide contact-modal component (narthex modal key "contact"). Arriving on /contact
     opens it straight away; closing it leaves this page's heading and a button to open it again. -->
<script>
  document.addEventListener('DOMContentLoaded', function () {
    if (window.vci && vci.modal && !vci.modal.isOpen('contact')) vci.modal.open('contact');
  });
</script>
